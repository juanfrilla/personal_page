cv:
  name: Juan Francisco Martin
  document_title: JF_Software_Spanish # <--- Cambia esto
  headline: Ingeniero de Software
  location: Teguise, Islas Canarias, España
  email: juanframaro@gmail.com
  photo: ./pic.jpg
  phone: "+34 683593896"
  website: https://juanfrilla.github.io/
  social_networks:
    - network: LinkedIn
      username: jfmozaga
    - network: GitHub
      username: juanfrilla
    - network: YouTube
      username: jfmozaga
  custom_connections:
  sections:
    sumario:
      - Ingeniero especializado en Web Scraping y Backend, experto en bypass de sistemas anti-bot, ingeniería inversa en navegadores y desofuscación compleja de JavaScript (protecciones en VM, AST con Babel). Acompaño mi desarrollo con flujos de trabajo avanzados asistidos por IA (LLMs, MCPs).
    education:
      - institution: Escuela de Organización Industrial (EOI)
        area: en Programación Web Full-Stack
        degree: Bootcamp
        start_date: 2021-09
        end_date: 2021-12
        location: Madrid, España (Remoto)
      - institution: Universidad de Las Palmas de Gran Canaria (ULPGC)
        area: en Ingeniería en Telecommunicaciones
        degree: Grado
        start_date: 2012-09
        end_date: 2019-07
        location: Gran Canaria, España
        highlights:
          - "Nota: 7/10"
          - "Tecnologías: Java, Matlab, C, Ensamblador, MySQL"
          - "Proyecto final: Sistema de clasificación de sonidos atmosféricos mediante Machine Learning y localización de la dirección de llegada (DOA)."
    experiencia:
      - company: Vumi.io
        position: Ingeniero de Web Scraping
        date:
        start_date: 2024-11
        end_date: 2025-11
        location: Asturias, España (Remoto)
        summary:
        highlights:
          - Integré y mantuve un sistema compuesto por ~50+ scrapers (~900+ solicitudes diarias) para extraer datos financieros de bancos y brokers, consolidando una base de datos de ~5+ GB.
          - Realicé ingeniería inversa de código JavaScript complejo mediante DevTools para automatizar flujos de autenticación (MFA/2FA, JWT y OAuth2) a través de solicitudes HTTP, evitando así la sobrecarga que supone el uso de un navegador.
          - Configuré Selenium Grid y Scrapoxy (red de proxies) en AWS EC2 utilizando Docker, además de implementar su CI/CD en GitHub Actions mediante SSH.
          - Integré Playwright con Selenium Grid para ejecutar tareas de scraping distribuidas y paralelizadas basadas en navegador.
          - Utilicé AWS Lambda para la ejecución de scrapers, CloudWatch para la observabilidad y S3 para el almacenamiento de archivos en formato CSV y JSON.
          - Implementé bypasses a escala para hCaptcha, reCAPTCHA v3 Enterprise, Cloudflare, Akamai o Imperva
          - Extraje información a partir del DOM, APIs o documentos PDF.
          - "Tecnologías: Burpsuite, Devtools, Scrapoxy, Selenium Grid, Linux, Docker, Git, AWS, PostgreSQL, Github Actions,
            Playwright, Pandas, Redis, Pytest"
      - company: Tirant Lo Blanch
        position: Ingeniero de Web Scraping
        date:
        start_date: 2023-02
        end_date: 2024-11
        location: Valencia, España (Remoto)
        summary:
        highlights:
          - Integré y mantuve un sistema de ~700+ spiders (~70K+ peticiones diarias) para extraer datos jurídicos de sitios web gubernamentales en España, Portugal y Latinoamérica, consolidando una base de datos de ~10+ TB.
          - Mantuve un proyecto heredado (legacy) desarrollado con el framework Grails (Groovy).
          - Configuré Selenium Grid en AWS EC2 para escalar la infraestructura de navegadores.
          - Integré una red de proxies basada en el servicio Tor para realizar web scraping de forma anónima.
          - Diseñé un sistema de rotación de proxies y cabeceras (headers) para evitar bloqueos.
          - Extraje datos del DOM y de APIs, y diseñé un sistema específico para procesar y extraer información de archivos PDF, DOC y DOCX.
          - Utilicé AWS S3 para el almacenamiento de archivos PDF.
          - Implementé un flujo de CI/CD para el proyecto de scraping mediante GitLab CI a través de SSH.
          - "Tecnologías: Scrapy, Selenium Grid, Tomcat, Java, Groovy, Grails, MongoDB, SQL, Git, Linux, Docker, Gitlab CI, AWS"
      - company: TuCalendi
        position: Desarrollador Back-end
        date:
        start_date: 2022-03
        end_date: 2022-12
        location: Tenerife, España (Remoto)
        summary:
        highlights:
          - Migré y desplegué una API heredada de PHP (CodeIgniter) a Python (FastAPI) en entornos contenedorizados con Docker, gestionando 50+ llamadas concurrentes con alta disponibilidad.
          - Diseñé y desarrollé aplicaciones de voz conversacionales para Amazon Alexa.
          - "Tecnologías: FastAPI, MariaDB, Linux, Git, Plesk, PHP, Docker, Github Actions, Postman, Pytest"
      - company: Ayuntamiento de Tías
        position: Técnico Informático
        date:
        start_date: 2021-03
        end_date: 2021-09
        location: Lanzarote, España
        summary:
        highlights:
          - Soporte técnico a los empleados y automatización de tareas catastrales.
    lenguajes:
      - "Español: Nativo"
      - "Inglés: Competencia profesional completa (C1)"
design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 1cm # Bajamos de 1.2 a 1cm
    bottom_margin: 1cm
    left_margin: 1.25cm
    right_margin: 1.25cm
  header:
    connections:
      phone_number_format: international
      show_icons: true
    photo_width: 4.5cm # Foto ligeramente más pequeña
    photo_position: left
    space_below_name: 0.15cm
    space_below_headline: 0.15cm
    space_below_connections: 0.15cm
  section_titles:
    space_above: 0.35cm # Un pelín menos de aire entre secciones
    space_below: 0.12cm
  sections:
    space_between_regular_entries: 0.5em # Espacio entre trabajos ajustado
    space_between_text_based_entries: 0.25em
  entries:
    highlights:
      space_above: 0.08cm
      space_between_items: 0.06cm # Puntos de la lista un poco más compactos
  typography:
    line_spacing: 0.42em # Interlineado de precisión (antes 0.45)
    font_size:
      body: 10pt # El tamaño ideal para lectura
      name: 23pt # Nombre equilibrado
      headline: 10.2pt
      connections: 9pt
      section_titles: 11.5pt
