cv:
  name: Juan Francisco Martin
  document_title: JF_Software_English # <--- Cambia esto
  headline: Software Engineer
  location: Teguise, Canary Islands, Spain
  email: juanframaro@gmail.com
  photo: ./pic.jpg
  phone: "+34 683593896"
  website: https://juanfrilla.github.io/
  social_networks:
    - network: LinkedIn
      username: jfmozaga
    - network: GitHub
      username: juanfrilla
    - network: YouTube
      username: jfmozaga
  custom_connections:
  sections:
    summary:
    - Experienced in web scraping (anti-bot bypasses & browser reverse engineering) and backend development. Expanding expertise in complex JavaScript deobfuscation (VM-based protections or Babel AST). 
    - Driven to step out of my comfort zone and eager for my first international role.
    education:
      - institution: Industrial Organization School (EOI)
        area: Full Stack Web Programming
        degree: Bootcamp
        start_date: 2021-09
        end_date: 2021-12
        location: Madrid, Spain (Remote)
      - institution: University of Las Palmas de Gran Canaria (ULPGC)
        area: Telecommunications Engineering
        degree: BS
        start_date: 2012-09
        end_date: 2019-07
        location: Gran Canaria, Spain
        highlights:
          - "GPA: 7/10"
          - "Technologies: Java, Matlab, C, Assembly, MySQL"
          - "Final Project: Atmospheric sound classification system using ML and Direction of Arrival."
    experience:
      - company: Vumi.io
        position: Web Scraping Engineer
        date:
        start_date: 2024-11
        end_date: 2025-11
        location: Asturias, Spain (Remote)
        summary:
        highlights:
          - Integrated and maintained a system with ~50+ scrapers (~900+ daily requests) to extract financial data from banks and brokers, growing a database of ~5 GB+.
          - Reverse-engineered complex JavaScript using DevTools to automate MFA/2FA, JWT, and OAuth2 authentication flows via pure HTTP requests, avoiding browser overhead.
          - Configured Selenium Grid and Scrapoxy (proxy network), on AWS EC2 with Docker, and Github Actions via SSH.
          - Conected Playwright with Selenium Grid to support browser-based distributed and parallelized scraping tasks.
          - I used AWS, that is, Lambda with Serverless architecture for scalable scraping, CloudWatch for observability, and S3 for CSV and JSON storage.
          - Implemented advanced bypass solutions for hCaptcha, reCAPTCHA or Cloudflare.
          - Extracted information from the DOM, APIs, or PDFs.
          - "Technologies: Burpsuite, Devtools, Scrapoxy, Selenium Grid, Linux, Docker, Git, AWS, PostgreSQL, Github Actions,
            Playwright, Pandas, Redis, Pytest"
      - company: Tirant Lo Blanch
        position: Web Scraping Engineer
        date:
        start_date: 2023-02
        end_date: 2024-11
        location: Valencia, Spain (Remote)
        summary:
        highlights:
          - Integrated and maintained a system of ~700+ spiders (~70K+ daily requests) extracting legal data from government websites across Spain, Portugal, and LATAM, growing a database of ~10+ TB.
          - Maintained a legacy project, written in the grails framework (groovy).
          - Configured Selenium Grid on AWS EC2 to scale the browser infrastructure.
          - Integrated a Tor Service proxy network for anonymized web scraping.
          - Engineered a rotating proxies/headers system to avoid bans.
          - Extracted data from the DOM, APIs, and created a system for parsing information from PDF, DOC, and DOCX files.
          - Used AWS S3 for PDF storage.
          - Implemented the scraping project's CI/CD with Gitlab CI via SSH.
          - "Technologies: Scrapy, Selenium Grid, Tomcat, Java, Groovy, Grails, MongoDB, SQL, Git, Linux, Docker, Gitlab CI, AWS"
      - company: TuCalendi
        position: Back-end Developer
        date:
        start_date: 2022-03
        end_date: 2022-12
        location: Tenerife, Spain (Remote)
        summary:
        highlights:
          - Migrated and deployed a legacy PHP (CodeIgniter) API to Python (FastAPI) in Docker containerized environments, handling ~50+ concurrent calls with high availability.
          - Designed and developed conversational voice applications for Amazon Alexa.
          - "Technologies: FastAPI, MariaDB, Linux, Git, Plesk, PHP, Docker, Github Actions, Postman, Pytest"
      - company: Tías Town Hall
        position: Computer Technisian
        date:
        start_date: 2021-03
        end_date: 2021-09
        location: Lanzarote, Spain
        summary:
        highlights:
          - Technical support to employees and automation of cadastral tasks.
    languages:
      - "Spanish: Native"
      - "English: Professional Working Proficiency (C1)"
design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 1cm # Bajamos de 1.2 a 1cm
    bottom_margin: 1cm
    left_margin: 1.25cm
    right_margin: 1.25cm
  header:
    connections:
      phone_number_format: international
      show_icons: true
    photo_width: 4.5cm # Foto ligeramente más pequeña
    photo_position: left
    space_below_name: 0.15cm
    space_below_headline: 0.15cm
    space_below_connections: 0.15cm
  section_titles:
    space_above: 0.35cm # Un pelín menos de aire entre secciones
    space_below: 0.12cm
  sections:
    space_between_regular_entries: 0.5em # Espacio entre trabajos ajustado
    space_between_text_based_entries: 0.25em
  entries:
    highlights:
      space_above: 0.08cm
      space_between_items: 0.06cm # Puntos de la lista un poco más compactos
  typography:
    line_spacing: 0.42em # Interlineado de precisión (antes 0.45)
    font_size:
      body: 10pt # El tamaño ideal para lectura
      name: 23pt # Nombre equilibrado
      headline: 10.2pt
      connections: 9pt
      section_titles: 11.5pt
